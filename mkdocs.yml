site_name: QAgent Gym
site_url: https://qagents-ai.github.io/qagent-gym/
repo_url: https://github.com/qagents-ai/qagent-gym
repo_name: qagents-ai/qagent-gym
edit_uri: ""
site_description: Persistent context learning, frozen evaluation, and local agent examples.
strict: true
use_directory_urls: true
theme:
  name: material
  logo: assets/brand/qagents-icon-dark.svg
  favicon: assets/brand/qagents-icon-32.png
  font: false
  palette:
    primary: teal
    accent: orange
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
extra_css:
  - assets/gym-home.css
plugins:
  - search
markdown_extensions:
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
