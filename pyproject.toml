[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qagent-gym"
version = "0.1.0"
description = "Persistent context learning and offline evaluation for qagents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["qagents>=0.2,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "hatchling"]
mem0 = ["mem0ai>=2.2.1,<3"]
langgraph = ["langgraph>=1.2.21,<2", "langchain-core>=1.8,<2"]
dspy = ["dspy>=3.5,<4"]
elevenlabs = ["elevenlabs>=2.78,<3"]
twilio = ["twilio>=9.13,<10"]
tracing = ["opentelemetry-api>=1.45,<2", "opentelemetry-sdk>=1.45,<2"]
docs = ["mkdocs>=1.6.1,<2", "mkdocs-material>=9.8.1,<10"]

[project.scripts]
qagent-gym = "qagent_gym.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qagent_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
